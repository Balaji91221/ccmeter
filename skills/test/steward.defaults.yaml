skill: test
budgets:
  context_tokens: 60000
  input_new_tokens: 10000
  output_tokens: 3000
  cache_prefix_stable: true
always_keep:
  - errors
  - user_messages
  - current_stage_goal
  - pass_packet
stages:
  - id: inventory
    intent: Map existing tests and gaps
    input_policy:
      code: signatures_only
      logs: errors_only
    pass_to_next:
      type: map
      fields: [existing_tests, gaps, risk_areas]
      max_tokens: 1200
  - id: add_tests
    intent: Implement targeted cases
    input_policy:
      prior: use_pass_only
      code:
        full_for: hot_files
    output_policy:
      effort: high
      no_restate_context: true
    pass_to_next:
      type: diff_summary
      fields: [files_changed, cases_added]
      max_tokens: 900
  - id: verify
    intent: Run suite and report
    pass_to_next:
      type: changelog
      fields: [status, tests_run, residual_gaps]
      max_tokens: 500
fail_closed:
  if_over_budget: compress_then_drop_lowest_score
  if_need_detail: require_ccr_retrieve
