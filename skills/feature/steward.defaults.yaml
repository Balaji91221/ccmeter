skill: feature
budgets:
  context_tokens: 70000
  input_new_tokens: 12000
  output_tokens: 4000
  cache_prefix_stable: true
always_keep:
  - errors
  - user_messages
  - current_stage_goal
  - pass_packet
stages:
  - id: design
    intent: Define contract and thin vertical slice
    input_policy:
      code: signatures_only
      json:
        crush_if_over: 500
    pass_to_next:
      type: plan
      fields: [contract, milestones, tests]
      max_tokens: 2000
  - id: implement
    intent: Implement slice per plan
    input_policy:
      prior: use_pass_only
      code:
        full_for: hot_files
    output_policy:
      effort: high
      no_restate_context: true
    pass_to_next:
      type: diff_summary
      fields: [files_changed, tests, residual_risks]
      max_tokens: 1000
  - id: verify
    intent: Acceptance checks against brief
    output_policy:
      effort: medium
    pass_to_next:
      type: changelog
      fields: [status, residual_risks]
      max_tokens: 600
fail_closed:
  if_over_budget: compress_then_drop_lowest_score
  if_need_detail: require_ccr_retrieve
