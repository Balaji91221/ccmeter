skill: debug
budgets:
  context_tokens: 60000
  input_new_tokens: 10000
  output_tokens: 3000
  cache_prefix_stable: true
always_keep:
  - errors
  - user_messages
  - current_stage_goal
  - pass_packet
stages:
  - id: repro
    intent: Reproduce the failure or document why blocked
    input_policy:
      code: signatures_only
      logs: errors_only
      json:
        crush_if_over: 400
    pass_to_next:
      type: map
      fields: [repro_steps, symptoms, artifacts]
      max_tokens: 1200
  - id: isolate
    intent: Narrow to root cause with evidence
    input_policy:
      prior: use_pass_only
      code:
        full_for: suspects
    pass_to_next:
      type: plan
      fields: [root_cause, evidence, fix_plan]
      max_tokens: 1500
  - id: fix
    intent: Minimal correct fix
    input_policy:
      prior: use_pass_only
      code:
        full_for: suspects
    output_policy:
      effort: high
      no_restate_context: true
    pass_to_next:
      type: diff_summary
      fields: [files_changed, why, residual_risks]
      max_tokens: 800
  - id: verify
    intent: Confirm fix and no obvious regressions
    output_policy:
      effort: medium
    pass_to_next:
      type: changelog
      fields: [status, tests_run, residual_risks]
      max_tokens: 500
fail_closed:
  if_over_budget: compress_then_drop_lowest_score
  if_need_detail: require_ccr_retrieve
